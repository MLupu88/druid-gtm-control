name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest

    # Postgres service for @workspace/db's integration test suite
    # (lib/db/src/schema/integrity.integration.test.ts). That suite skips
    # itself when DATABASE_URL is unset — setting it here for the whole
    # job means it is never skipped in CI, only in local dev where no
    # Postgres instance is provisioned (see lib/db/README.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gtm-shared test suite
        run: node --test lib/gtm-shared/src/gtmContract.test.js lib/gtm-shared/src/messageComposer.test.js lib/gtm-shared/src/researchEligibility.test.js lib/gtm-shared/src/scenarios.test.js

      - name: Run @workspace/identity test suite
        run: pnpm --filter @workspace/identity run test

      - name: Apply @workspace/db migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Run @workspace/db test suite (structural + integration; DATABASE_URL is set above, so integration tests cannot silently skip here)
        run: pnpm --filter @workspace/db run test

      - name: Run @workspace/api-server signal-ingestion suite (unit + route + integration; DATABASE_URL is set above, so the integration suite cannot silently skip here)
        run: pnpm --filter @workspace/api-server run test:signals

      - name: Run @workspace/api-server attention-items suite (unit + route + integration; DATABASE_URL is set above, so the integration suite cannot silently skip here)
        run: pnpm --filter @workspace/api-server run test:attention-items

      - name: Run @workspace/api-server accounts suite (unit + route + integration; DATABASE_URL is set above, so the integration suite cannot silently skip here)
        run: pnpm --filter @workspace/api-server run test:accounts

      - name: Typecheck libs (includes @workspace/db)
        run: pnpm run typecheck:libs

      - name: Typecheck druid-gtm
        run: pnpm --filter @workspace/druid-gtm run typecheck
