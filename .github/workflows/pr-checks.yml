name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gtm-shared test suite
        run: node --test lib/gtm-shared/src/gtmContract.test.js lib/gtm-shared/src/messageComposer.test.js lib/gtm-shared/src/researchEligibility.test.js lib/gtm-shared/src/scenarios.test.js

      - name: Typecheck druid-gtm
        run: pnpm --filter @workspace/druid-gtm run typecheck
