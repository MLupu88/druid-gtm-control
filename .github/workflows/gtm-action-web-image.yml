name: Build and publish gtm-action-web image

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/gtm-action-web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "artifacts/gtm-action-web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck gtm-action-web
        run: pnpm --filter @workspace/gtm-action-web typecheck

      - name: Build gtm-action-web
        run: pnpm --filter @workspace/gtm-action-web build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./artifacts/gtm-action-web
          file: ./artifacts/gtm-action-web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mlupu88/druid-gtm-control/gtm-action-web:latest
            ghcr.io/mlupu88/druid-gtm-control/gtm-action-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
